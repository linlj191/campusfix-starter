name: CI自动测试
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt
        
      - name: 使用Secret，打印token长度（不输出明文）
        run: echo "token长度=${#TEST_TOKEN}"
        env:
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}


      - name: 执行pytest测试
        run: pytest tests/ -v


