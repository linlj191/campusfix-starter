name: CI自动测试
on: [push, pull_request]
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt


      - name: 执行pytest测试
        run: pytest --ignore=tests/test_validation.py

